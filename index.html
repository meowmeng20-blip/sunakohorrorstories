<head>
    <meta charset="UTF-8">

    <meta name="keywords" content="horror stories, tagalog horror stories, true ghost stories, urban legends, kwentong kababalaghan, sunako horror">
    <meta name="author" content="Sunako Admin">
    <meta name="robots" content="index, follow">

    <!-- OPEN GRAPH / SOCIAL MEDIA META TAGS (FB, TikTok, Messenger Previews) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="SUNAKO HORROR STORIES - Real Life Stories & Urban Legends">
    <meta property="og:description" content="Read horrifying true experiences, Philippine urban legends, and creepy encounters in Tagalog and English.">
    <meta property="og:image" content="https://i.imgur.com/ZwjB8c0.jpg">
    <meta property="og:url" content="https://sunakohorror.com/">

    <!-- GOOGLE ADSENSE CODE -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6737021640296795"
         crossorigin="anonymous"></script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .font-creepster { font-family: 'Creepster', cursive; }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top, #1a0303 0%, #080101 50%, #000000 100%);
            background-attachment: fixed;
            color: #e5e7eb;
        }
        .story-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .story-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 25px -5px rgba(220, 38, 38, 0.35), 0 8px 10px -6px rgba(220, 38, 38, 0.2);
        }
        .glow-text {
            text-shadow: 0 0 10px rgba(220, 38, 38, 0.7), 0 0 20px rgba(220, 38, 38, 0.4);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-red-900 selection:text-white">

    <!-- NAVIGATION BAR -->
    <nav class="border-b border-red-950/60 bg-black/85 backdrop-blur-md sticky top-0 z-50 px-4 py-3 shadow-lg">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <i class="fa-solid font-bold fa-skull text-red-600 text-2xl animate-pulse"></i>
                <span class="font-creepster text-2xl text-red-600 tracking-wider glow-text">SUNAKO</span>
            </a>
            
            <div class="hidden md:flex items-center gap-6 text-sm font-medium text-gray-300">
                <a href="index.html" class="hover:text-red-500 transition-colors text-red-500">Home</a>
                <a href="#stories" class="hover:text-red-500 transition-colors">Stories</a>
                <button onclick="openModal('about')" class="hover:text-red-500 transition-colors">About Us</button>
                <button onclick="openModal('contact')" class="hover:text-red-500 transition-colors">Contact</button>
            </div>

            <!-- SEARCH BAR -->
            <div class="relative w-48 md:w-64">
                <input type="text" id="searchInput" oninput="filterStories()" placeholder="Find a story..." 
                       class="w-full bg-red-950/20 border border-red-900/40 rounded-full py-1.5 pl-9 pr-4 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-red-600 focus:ring-1 focus:ring-red-600 transition-all">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-500 text-xs"></i>
            </div>
        </div>
    </nav>

    <!-- TOP ADSENSE BANNER SLOT -->
    <div class="max-w-7xl mx-auto w-full px-4 mt-4">
        <div class="bg-red-950/10 border border-red-900/20 rounded-lg p-2 text-center text-xs text-gray-500 uppercase tracking-widest min-h-[60px] flex items-center justify-center overflow-hidden">
            <ins class="adsbygoogle"
                 style="display:block; width:100%; max-height:90px;"
                 data-ad-client="ca-pub-6737021640296795"
                 data-ad-slot="auto"
                 data-ad-format="horizontal"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </div>

    <!-- MAIN HEADER SECTION -->
    <header class="text-center py-12 px-4">
        <h1 class="font-creepster text-4xl sm:text-6xl text-red-600 tracking-widest glow-text mb-2">
            SUNAKO HORROR STORIES
        </h1>
        <p class="text-xs sm:text-sm uppercase tracking-[0.3em] font-semibold text-gray-400">
            REAL LIFE STORIES & URBAN LEGENDS
        </p>
    </header>

    <!-- CONTENT SECTION -->
    <main class="max-w-7xl mx-auto px-4 flex-grow w-full mb-12" id="stories">
        
        <!-- CATEGORY FILTERS -->
        <div class="flex flex-wrap items-center justify-between gap-4 mb-8 border-b border-red-950/50 pb-4 sticky top-[60px] bg-black/70 backdrop-blur-md z-40 p-2 rounded-lg">
            <div class="flex flex-wrap gap-2">
                <button onclick="setCategory('all')" id="btn-all" class="filter-btn bg-red-600 text-white text-xs font-semibold px-4 py-1.5 rounded-full transition-all">All</button>
                <button onclick="setCategory('tagalog')" id="btn-tagalog" class="filter-btn bg-red-950/40 hover:bg-red-900/50 text-gray-300 text-xs font-semibold px-4 py-1.5 rounded-full border border-red-900/30 transition-all">Tagalog</button>
                <button onclick="setCategory('english')" id="btn-english" class="filter-btn bg-red-950/40 hover:bg-red-900/50 text-gray-300 text-xs font-semibold px-4 py-1.5 rounded-full border border-red-900/30 transition-all">English</button>
                <button onclick="setCategory('real-life')" id="btn-real-life" class="filter-btn bg-red-950/40 hover:bg-red-900/50 text-gray-300 text-xs font-semibold px-4 py-1.5 rounded-full border border-red-900/30 transition-all">
                    <i class="fa-solid fa-fire text-orange-500 mr-1"></i> True Experiences
                </button>
            </div>
            <span id="storyCount" class="text-xs text-gray-500">0 Stories Found</span>
        </div>

        <!-- STORIES GRID -->
        <div id="storiesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
            <!-- Dynamically populated via JavaScript -->
        </div>

    </main>

    <!-- FOOTER BANNER AD SLOT -->
    <div class="max-w-7xl mx-auto w-full px-4 mb-8">
        <div class="bg-red-950/10 border border-red-900/20 rounded-lg p-2 text-center text-xs text-gray-500 uppercase tracking-widest min-h-[60px] flex items-center justify-center overflow-hidden">
            <ins class="adsbygoogle"
                 style="display:block; width:100%; max-height:90px;"
                 data-ad-client="ca-pub-6737021640296795"
                 data-ad-slot="auto"
                 data-ad-format="horizontal"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-black border-t border-red-950/80 py-8 px-4 text-xs text-gray-500">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
                <span class="font-creepster text-lg text-red-600 mr-2">SUNAKO</span> 
                &copy; 2026 SUNAKO HORROR STORIES. All rights reserved.
            </div>
            <div class="flex flex-wrap justify-center gap-6">
                <button onclick="openModal('about')" class="hover:text-gray-300 transition-colors">About Us</button>
                <button onclick="openModal('privacy')" class="hover:text-gray-300 transition-colors">Privacy Policy</button>
                <button onclick="openModal('terms')" class="hover:text-gray-300 transition-colors">Terms of Service</button>
                <button onclick="openModal('contact')" class="hover:text-gray-300 transition-colors">Contact Us</button>
            </div>
        </div>
    </footer>

    <!-- MODAL FOR ADSENSE PAGES -->
    <div id="infoModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-red-900/50 rounded-xl max-w-2xl w-full max-h-[80vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b border-zinc-800 flex items-center justify-between bg-zinc-950">
                <h3 id="modalTitle" class="font-bold text-lg text-red-500">Title</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="modalBody" class="p-6 overflow-y-auto text-sm text-gray-300 space-y-4 leading-relaxed">
                <!-- Dynamic Content -->
            </div>
        </div>
    </div>

    <!-- 1. EXTERNAL STORIES DATA -->
    <script src="stories.js"></script>

    <!-- 2. MAIN LOGIC SCRIPT -->
    <script>
        let activeCategory = 'all';

        function renderStories() {
            const grid = document.getElementById('storiesGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = stories.filter(story => {
                const matchesCat = activeCategory === 'all' || 
                                  (activeCategory === 'tagalog' && story.lang === 'tagalog') ||
                                  (activeCategory === 'english' && story.lang === 'english') ||
                                  (activeCategory === 'real-life' && story.category === 'real-life');
                
                const matchesSearch = story.title.toLowerCase().includes(searchVal) || 
                                      story.excerpt.toLowerCase().includes(searchVal);

                return matchesCat && matchesSearch;
            });

            document.getElementById('storyCount').innerText = `${filtered.length} Stories Found`;

            filtered.forEach((story, index) => {
                // In-Feed Ad Slot pagkatapos ng 4th card
                if(index === 4) {
                    grid.innerHTML += `
                        <div class="col-span-1 bg-red-950/10 border border-red-900/30 rounded-lg p-2 flex flex-col items-center justify-center text-center text-xs text-gray-500 overflow-hidden">
                            <span class="text-[10px] tracking-widest text-red-900/80 mb-2 uppercase">Sponsored</span>
                            <div class="w-full h-full flex items-center justify-center border border-dashed border-red-950 rounded p-2">
                                <ins class="adsbygoogle"
                                     style="display:block; width:100%;"
                                     data-ad-format="fluid"
                                     data-ad-layout-key="-fb+5w+4e-db+86"
                                     data-ad-client="ca-pub-6737021640296795"
                                     data-ad-slot="auto"></ins>
                                <script>
                                     (adsbygoogle = window.adsbygoogle || []).push({});
                                <\/script>
                            </div>
                        </div>
                    `;
                }

                grid.innerHTML += `
                    <div class="story-card bg-zinc-950 border border-red-950 rounded-lg overflow-hidden flex flex-col justify-between group">
                        <div>
                            <!-- COVER IMAGE LINK -->
                            <a href="${story.link}" class="block relative aspect-[3/4] overflow-hidden bg-zinc-900">
                                <img src="${story.cover}" alt="${story.title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                <span class="absolute top-2 left-2 bg-black/70 backdrop-blur-md text-red-400 text-[10px] font-bold px-2 py-0.5 rounded border border-red-900/40 uppercase">
                                    ${story.lang}
                                </span>
                                <span class="absolute bottom-2 right-2 bg-black/80 text-yellow-500 text-[10px] font-bold px-1.5 py-0.5 rounded flex items-center gap-1">
                                    <i class="fa-solid fa-star text-[9px]"></i> ${story.rating}
                                </span>
                            </a>

                            <!-- CARD CONTENT -->
                            <div class="p-3">
                                <a href="${story.link}">
                                    <h3 class="font-semibold text-gray-100 text-sm line-clamp-1 group-hover:text-red-500 transition-colors">
                                        ${story.title}
                                    </h3>
                                </a>
                                <p class="text-[11px] text-red-400/80 mb-1.5 flex items-center gap-1">
                                    <i class="fa-solid fa-user text-[9px]"></i> ${story.author}
                                </p>
                                <p class="text-xs text-gray-400 line-clamp-2 leading-relaxed">
                                    ${story.excerpt}
                                </p>
                            </div>
                        </div>

                        <!-- READ BUTTON LINK -->
                        <div class="p-3 pt-0">
                            <a href="${story.link}" class="block w-full text-center bg-red-950/40 hover:bg-red-700 text-red-300 hover:text-white border border-red-800/40 rounded py-1.5 text-xs font-semibold transition-all">
                                Read Story <i class="fa-solid fa-book-open ml-1 text-[10px]"></i>
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        function setCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn bg-red-950/40 hover:bg-red-900/50 text-gray-300 text-xs font-semibold px-4 py-1.5 rounded-full border border-red-900/30 transition-all";
            });
            
            const activeBtn = document.getElementById(`btn-${cat}`);
            if(activeBtn) {
                activeBtn.className = "filter-btn bg-red-600 text-white text-xs font-semibold px-4 py-1.5 rounded-full transition-all";
            }
            renderStories();
        }

        function filterStories() {
            renderStories();
        }

        const modalTexts = {
            about: {
                title: "About Sunako Horror Stories",
                content: `<p>Welcome to <strong>Sunako Horror Stories</strong>, a dedicated online hub for real-life horror experiences, urban legends, and terrifying folklore stories.</p>
                          <p>Our goal is to bring together readers and writers who love eerie, dark, and chilling real-world experiences from around the globe.</p>`
            },
            privacy: {
                title: "Privacy Policy",
                content: `<p>At Sunako Horror Stories, accessible from our website, one of our main priorities is the privacy of our visitors.</p>
                          <p><strong>Google AdSense & DoubleClick Cookie:</strong> Google, as a third-party vendor, uses cookies to serve ads on our site. Google's use of advertising cookies enables it and its partners to serve ads to our users based on their visit to our site or other websites on the Internet.</p>
                          <p>Users may choose to opt-out of personalized advertising by visiting Google Ads Settings.</p>`
            },
            terms: {
                title: "Terms of Service",
                content: `<p>By accessing Sunako Horror Stories, you agree to comply with these terms of service and all applicable laws and regulations.</p>
                          <p>All horror stories posted here are for entertainment and reading purposes. Unlawful copying or unauthorized scraping of content without permission is strictly prohibited.</p>`
            },
            contact: {
                title: "Contact Us",
                content: `<p>If you have any questions, feedback, or horror story submissions, feel free to reach out to us:</p>
                          <p class="font-semibold text-red-400">Email: contact@sunakohorror.com</p>
                          <p class="text-xs text-gray-400 mt-4">We usually respond within 24 to 48 hours.</p>`
            }
        };

        function openModal(type) {
            const data = modalTexts[type];
            if(data) {
                document.getElementById('modalTitle').innerText = data.title;
                document.getElementById('modalBody').innerHTML = data.content;
                document.getElementById('infoModal').classList.remove('hidden');
            }
        }

        function closeModal() {
            document.getElementById('infoModal').classList.add('hidden');
        }

        renderStories();
    </script>
</body>
</html>
