                <button onclick="setCategory('all')" id="btn-all" class="filter-btn bg-red-600 text-white text-xs font-semibold px-4 py-1.5 rounded-full transition-all">All Stories</button>
                <button onclick="setCategory('tagalog')" id="btn-tagalog" class="filter-btn bg-red-950/40 hover:bg-red-900/50 text-gray-300 text-xs font-semibold px-4 py-1.5 rounded-full border border-red-900/30 transition-all">🇵🇭 Tagalog</button>
                <button onclick="setCategory('english')" id="btn-english" class="filter-btn bg-red-950/40 hover:bg-red-900/50 text-gray-300 text-xs font-semibold px-4 py-1.5 rounded-full border border-red-900/30 transition-all">🌐 English</button>

    <!-- 2. MAIN LOGIC SCRIPT -->
    <script>
        let activeCategory = 'all';

        function renderStories() {
            const grid = document.getElementById('storiesGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = stories.filter(story => {
                const matchesCat = activeCategory === 'all' || 
                                  (activeCategory === 'tagalog' && story.lang === 'tagalog') ||
                                  (activeCategory === 'english' && story.lang === 'english') ||
                                  (activeCategory === 'real-life' && story.category === 'real-life');
                
                const matchesSearch = story.title.toLowerCase().includes(searchVal) || 
                                      story.excerpt.toLowerCase().includes(searchVal);

                return matchesCat && matchesSearch;
            });

            document.getElementById('storyCount').innerText = `${filtered.length} Stories Available`;

            filtered.forEach((story, index) => {
                if(index === 4) {
                    grid.innerHTML += `
                        <div class="col-span-1 bg-red-950/10 border border-red-900/30 rounded-lg p-2 flex flex-col items-center justify-center text-center text-xs text-gray-500 overflow-hidden">
                            <span class="text-[10px] tracking-widest text-red-900/80 mb-2 uppercase">Sponsored</span>
                            <div class="w-full h-full flex items-center justify-center border border-dashed border-red-950 rounded p-2">
                                <ins class="adsbygoogle"
                                     style="display:block; width:100%;"
                                     data-ad-format="fluid"
                                     data-ad-layout-key="-fb+5w+4e-db+86"
                                     data-ad-client="ca-pub-6737021640296795"
                                     data-ad-slot="auto"></ins>
                                <script>
                                     (adsbygoogle = window.adsbygoogle || []).push({});
                                <\/script>
                            </div>
                        </div>
                    `;
                }

                grid.innerHTML += `
                    <div class="story-card bg-zinc-950 border border-red-950 rounded-lg overflow-hidden flex flex-col justify-between group">
                        <div>
                            <a href="${story.link}" class="block relative aspect-[3/4] overflow-hidden bg-zinc-900">
                                <img src="${story.cover}" alt="${story.title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                <span class="absolute top-2 left-2 bg-black/70 backdrop-blur-md text-red-400 text-[10px] font-bold px-2 py-0.5 rounded border border-red-900/40 uppercase">
                                    ${story.lang}
                                </span>
                                <span class="absolute bottom-2 right-2 bg-black/80 text-yellow-500 text-[10px] font-bold px-1.5 py-0.5 rounded flex items-center gap-1">
                                    <i class="fa-solid fa-star text-[9px]"></i> ${story.rating}
                                </span>
                            </a>

                            <div class="p-3">
                                <a href="${story.link}">
                                    <h3 class="font-semibold text-gray-100 text-sm line-clamp-1 group-hover:text-red-500 transition-colors">
                                        ${story.title}
                                    </h3>
                                </a>
                                <p class="text-[11px] text-red-400/80 mb-1.5 flex items-center gap-1">
                                    <i class="fa-solid fa-user text-[9px]"></i> ${story.author}
                                </p>
                                <p class="text-xs text-gray-400 line-clamp-2 leading-relaxed">
                                    ${story.excerpt}
                                </p>
                            </div>
                        </div>

                        <div class="p-3 pt-0">
                            <a href="${story.link}" class="block w-full text-center bg-red-950/40 hover:bg-red-700 text-red-300 hover:text-white border border-red-800/40 rounded py-1.5 text-xs font-semibold transition-all">
                                Read Story <i class="fa-solid fa-book-open ml-1 text-[10px]"></i>
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        function setCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = "filter-btn bg-red-950/40 hover:bg-red-900/50 text-gray-300 text-xs font-semibold px-4 py-1.5 rounded-full border border-red-900/30 transition-all";
            });
            
            const activeBtn = document.getElementById(`btn-${cat}`);
            if(activeBtn) {
                activeBtn.className = "filter-btn bg-red-600 text-white text-xs font-semibold px-4 py-1.5 rounded-full transition-all";
            }
            renderStories();
        }

        function filterStories() {
            renderStories();
        }

        renderStories();
    </script>
